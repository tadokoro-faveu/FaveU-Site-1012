<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FaveU トップビジュアル試作</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: a full-screen 3D space pinned while the page scrolls. Scroll drives the camera: MACRO (lines, network, memory) → FLOW (events in time) → EARTH (a globe made of information). Controls below. */
:root{
  --bg:#04060c; --surface:#04060c; --ink:#f4f6fb; --ink-2:#8e9ab3; --line:#1c2540;
  --g1:#2b3a63; --g3:#6f86b8; --g4:#b4c3e0; --g5:#ffffff;
  --accent:#b680ff; --gold:#ffc46b; --cyan:#7cc9ff; color-scheme:dark;
  --display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
body{ background:var(--bg); color:var(--ink); font-family:var(--display); font-size:15px; line-height:1.7; }
.wrap{ max-width:1180px; margin:0 auto; padding-inline:20px; padding-block:28px 64px; display:flex; flex-direction:column; gap:28px; }
.mono{ font-family:var(--mono); font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-2); }

.track{ height:760vh; position:relative; }
.canvasBox{ position:sticky; top:0; height:100vh; height:100svh; background:var(--surface); touch-action:pan-y; cursor:crosshair; overflow:hidden; container-type:inline-size; }
canvas{ position:absolute; inset:0; width:100%; height:100%; display:block; }
#ov{ pointer-events:none; }
.bar{ position:absolute; left:0; right:0; top:0; z-index:2; display:flex; justify-content:space-between; gap:12px; padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,1.6cqw) 0; pointer-events:none; }
.over{ position:absolute; left:max(16px,1.6cqw); top:calc(44px + env(safe-area-inset-top,0px)); pointer-events:none; z-index:1; }
.over h1{ font-size:max(26px,min(4.6cqw,64px)); font-stretch:118%; font-weight:700; line-height:1.02; letter-spacing:-.01em; margin:6px 0 10px; text-shadow:0 0 18px var(--bg),0 0 4px var(--bg); }
.tag{ font-family:var(--mono); font-size:12px; color:var(--accent); }
.axis{ position:absolute; left:max(16px,1.6cqw); bottom:16px; z-index:2; display:flex; flex-wrap:wrap; gap:6px; max-width:calc(100% - 110px); }
.axis button{ all:unset; box-sizing:border-box; cursor:pointer; padding:6px 10px; border:1px solid var(--g1); background:var(--bg); font-family:var(--mono); font-size:11px; letter-spacing:.04em; color:var(--g4); }
.axis button[aria-pressed="true"]{ background:var(--g5); color:var(--bg); border-color:var(--g5); }
.axis button:focus-visible, .sw:focus-visible, .tog:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
.cap{ position:absolute; left:max(16px,1.6cqw); bottom:18px; z-index:1; pointer-events:none; opacity:0; }
.cap b{ display:block; font-size:max(20px,min(2.8cqw,36px)); font-stretch:115%; font-weight:700; line-height:1.15; text-shadow:0 0 14px #000,0 0 4px #000; }
.depth{ position:absolute; right:14px; top:50%; transform:translateY(-50%); height:46%; width:52px; z-index:2; pointer-events:none; }
.depth::before{ content:""; position:absolute; right:6px; top:0; bottom:0; width:1px; background:var(--g1); }
.depth span{ position:absolute; right:16px; font-family:var(--mono); font-size:10px; letter-spacing:.08em; color:var(--g3); transform:translateY(-50%); }
.depth .a{ top:0; } .depth .b{ top:58%; } .depth .c{ top:100%; }
.depth i{ position:absolute; right:2px; width:9px; height:9px; margin-top:-4px; background:var(--accent); top:0; }
.scrollHint{ position:absolute; right:14px; bottom:16px; z-index:2; pointer-events:none; color:var(--g4); }
[hidden].nogl{ display:none; }
.nogl{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; padding:24px; text-align:center; color:var(--g3); }

.panel{ display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:20px 32px; }
.ctl{ display:flex; flex-direction:column; gap:8px; min-width:0; }
.ctl label, .ctl .lab{ font-size:13px; font-weight:600; display:flex; justify-content:space-between; gap:8px; }
.ctl output{ font-family:var(--mono); font-size:12px; color:var(--ink-2); font-variant-numeric:tabular-nums; }
input[type=range]{ width:100%; accent-color:var(--accent); }
.sws{ display:flex; gap:10px; }
.sw{ all:unset; cursor:pointer; width:28px; height:28px; border-radius:50%; box-shadow:0 0 0 1px var(--line); }
.sw[aria-pressed="true"]{ box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--ink); }
.tog{ all:unset; cursor:pointer; padding:6px 12px; border:1px solid var(--g1); font-family:var(--mono); font-size:12px; color:var(--g4); }
.tog[aria-pressed="true"]{ background:var(--g5); color:var(--bg); border-color:var(--g5); }
.notes{ display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:24px 48px; border-top:1px solid var(--line); padding-top:24px; }
.notes h2{ font-size:16px; font-stretch:112%; margin:0 0 8px; }
.notes ul{ margin:0; padding-left:1.2em; color:var(--ink-2); font-size:14px; }
.notes li{ margin-bottom:4px; }
</style>
<style>html,body{margin:0}</style>
</head>
<body>


<div class="track" id="track">
  <div class="canvasBox" id="box">
    <canvas id="gl" role="img" aria-label="A 3D space where dense lines spread from one source into an endless neural network with floating memory and terminals. Scrolling moves the camera into a stream of events and then out to a globe made of information."></canvas>
    <canvas id="ov" aria-hidden="true"></canvas>
    <div class="nogl" id="nogl" hidden>3D (WebGL) is not available on this device.</div>
    <div class="bar mono"><span>FaveU Corporation / Top visual</span><span>RealWorld OS</span></div>
        <div class="axis" id="axis" role="group" aria-label="Stage">
      <button type="button" id="st1" data-front="-4.9" aria-pressed="false">01 Capture</button>
      <button type="button" id="st2" data-front="2.2" aria-pressed="false">02 Convert</button>
      <button type="button" id="st3" data-front="200" aria-pressed="true">03 Deliver</button>
    </div>
        <div class="cap mono" id="earthCap">Drag to rotate</div>
    <div class="depth" aria-hidden="true"><span class="a">MACRO</span><span class="b">FLOW</span><span class="c">EARTH</span><i id="depthDot"></i></div>
    <div class="scrollHint mono" id="hint">Scroll ↓</div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
  var box=document.getElementById('box'), glc=document.getElementById('gl'), ov=document.getElementById('ov'), o2=ov.getContext('2d'), track=document.getElementById('track');
  var elAxis=document.getElementById('axis'),elEarth=document.getElementById('earthCap'),elDot=document.getElementById('depthDot'),elHint=document.getElementById('hint');
  var renderer;
  try{ if(!window.THREE)throw 0; renderer=new THREE.WebGLRenderer({canvas:glc,antialias:true}); }
  catch(e){ document.getElementById('nogl').hidden=false; return; }
  var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  var V3=THREE.Vector3, W=1,H=1,dpr=1, ADD=THREE.AdditiveBlending;
  function col(h){return new THREE.Color(h);}
  var GH=['#2b3a63','#3d5288','#6f86b8','#b4c3e0','#ffffff'];
  var C={deep:col('#2443c4'),blue:col('#3f7dff'),cyan:col('#7cc9ff'),violet:col('#9b6bff'),white:col('#ffffff'),gold:col('#ffc46b')};
  var BG=col('#04060c'),BG2=col('#020307'),accent='#b680ff';
  var N=320,K=5,GATE=-4.6,front=reduce?200:-11,frontT=200,FOV=45,PCOUNT=13000,L=50;
  var S0=new V3(-10,0,0);
  var MONO='"IBM Plex Mono",ui-monospace,monospace', DISP='"Archivo","Helvetica Neue",Arial,sans-serif';
  var LABELS=['PERSON DETECTED','DWELL 00:38','ROUTE DEVIATION','HIGHLIGHT #07','ARRIVALS +12','ABNORMAL VIBRATION','CROWD 82%','VEHICLE ENTRY','FAN CAM 03','FALL RISK','DOCK CLEARED','VIP ARRIVAL','SCENE 02:14','SUSPICIOUS DWELL','FLOW BLOCKAGE','EQUIPMENT STOP','CHEER PEAK','SEARCH: 3 HITS'];
  var ptr={x:.3,y:-.1,tx:.3,ty:-.1,last:-1e9};
  var redraws=[];

  function rngf(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
  function clamp(v){return v<0?0:v>1?1:v;}
  function smooth(a,b,v){var t=clamp((v-a)/(b-a));return t*t*(3-2*t);}
  function gs(r){return (r()+r()+r()+r()-2)/2;}
  function unit(r){var z=r()*2-1,a=r()*6.283,s=Math.sqrt(1-z*z);return new V3(s*Math.cos(a),z,s*Math.sin(a));}
  function geo(p,c){var g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(p,3));if(c)g.setAttribute('color',new THREE.Float32BufferAttribute(c,3));return g;}
  // 曲線を線分として追加（色は c0→c1、明るさ k0→k1）
  var _a=new V3(),_b=new V3();
  function curve(P,Cl,a,b,ctrl,segs,c0,c1,k0,k1){
    for(var s=0;s<segs;s++){var t0=s/segs,t1=(s+1)/segs;
      for(var w=0;w<2;w++){var t=w?t1:t0,u=1-t,v=w?_b:_a;
        v.set(u*u*a.x+2*u*t*ctrl.x+t*t*b.x,u*u*a.y+2*u*t*ctrl.y+t*t*b.y,u*u*a.z+2*u*t*ctrl.z+t*t*b.z);
        var k=k0+(k1-k0)*t;Cl.push((c0.r+(c1.r-c0.r)*t)*k,(c0.g+(c1.g-c0.g)*t)*k,(c0.b+(c1.b-c0.b)*t)*k);}
      P.push(_a.x,_a.y,_a.z,_b.x,_b.y,_b.z);}
  }
  var WARM=[new THREE.Color('#ff7a2a'),new THREE.Color('#ffb347'),new THREE.Color('#ff4a2a'),new THREE.Color('#ff9a3c')];
  function warmCore(P,Cl,inner,outer,dim){for(var i=0;i<P.length;i+=3){var x=P[i],y=P[i+1],z=P[i+2],rr=Math.sqrt(x*x+y*y+z*z),w=1-smooth(inner,outer,rr);if(w<=0)continue;
    var b=Math.max(Cl[i],Cl[i+1],Cl[i+2]),wc=WARM[(i/3|0)%4],k=1-dim*w;
    Cl[i]=(Cl[i]*(1-w)+wc.r*b*w)*k;Cl[i+1]=(Cl[i+1]*(1-w)+wc.g*b*w)*k;Cl[i+2]=(Cl[i+2]*(1-w)+wc.b*b*w)*k;}}
  function bendCtrl(a,b,r,amt){var m=a.clone().add(b).multiplyScalar(.5);return m.add(unit(r).multiplyScalar(a.distanceTo(b)*amt));}

  renderer.localClippingEnabled=true;renderer.setClearColor(BG);
  var scene=new THREE.Scene();scene.fog=new THREE.FogExp2(BG.getHex(),.02);
  var camera=new THREE.PerspectiveCamera(FOV,1,.05,600);
  var clip=new THREE.Plane(new V3(-1,0,0),front);
  var macro=new THREE.Group(),fibG=new THREE.Group();scene.add(macro);macro.add(fibG);
  var mats=[];
  function reg(m,o){m.transparent=true;m.depthWrite=false;mats.push([m,o]);return m;}
  var nmats=[];
  function nmoveMat(m){for(var i=0;i<mats.length;i++)if(mats[i][0]===m){nmats.push(mats[i]);mats.splice(i,1);break;}return m;}
  function nmove(o){nmoveMat(o.material);return o;}
  function addLines(P,Cl,o,parent,noFog){var m=reg(new THREE.LineBasicMaterial({vertexColors:true,blending:ADD,clippingPlanes:[clip],fog:!noFog}),o);var l=new THREE.LineSegments(geo(P,Cl),m);(parent||macro).add(l);return l;}

  // camera paths (macro → flow)
  var CP=new THREE.CatmullRomCurve3([new V3(2,2.5,21),new V3(-15,5,9),new V3(-2.5,.4,.6),new V3(5,3,6),new V3(15,-2.5,3)]);
  var CL=new THREE.CatmullRomCurve3([new V3(.5,0,0),new V3(-4,0,0),new V3(8,0,0),new V3(15,-1,-3),new V3(32,-3.5,-7)]);
  var ROLL=[0,.14,-.1,-.3,.1];
  var camPts=CP.getPoints(60);

  // ---------- textures ----------
  function canvasTex(w,h,draw){var c=document.createElement('canvas');c.width=w;c.height=h;var t=new THREE.CanvasTexture(c);function d(){var x=c.getContext('2d');x.clearRect(0,0,w,h);draw(x);t.needsUpdate=true;}d();redraws.push(d);return t;}
  var discTex=canvasTex(64,64,function(x){x.fillStyle='#fff';x.beginPath();x.arc(32,32,30,0,6.283);x.fill();});
  var glowTex=canvasTex(64,64,function(x){var g=x.createRadialGradient(32,32,0,32,32,32);g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(.18,'rgba(255,255,255,.85)');g.addColorStop(.45,'rgba(255,255,255,.22)');g.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=g;x.fillRect(0,0,64,64);});
  var ringTex=canvasTex(128,128,function(x){x.strokeStyle='#fff';x.lineWidth=4;x.beginPath();x.arc(64,64,54,0,6.283);x.stroke();x.lineWidth=1.5;x.globalAlpha=.5;x.beginPath();x.arc(64,64,40,0,6.283);x.stroke();});
  function pts(P,Cl,size,tex,o,parent,noClip){var m=reg(new THREE.PointsMaterial({size:size,map:tex||glowTex,vertexColors:!!Cl,blending:ADD,clippingPlanes:noClip?[]:[clip]}),o);var p=new THREE.Points(geo(P,Cl),m);(parent||macro).add(p);return p;}

  // ---------- information terminals ----------
  var TERMS=[['INGEST','RTSP · CAM 04','#b8323a'],['EVENT BUS','evt/stream','#6d3fc4'],['INDEX','vec · 768d','#2e7d5b'],['MEMORY','0x7F3A · 2.4KB','#2d3a66'],['ALERT','level 2','#b8323a'],['QUERY','dwell > 30s','#8a6232'],['EDGE NODE','EDGE-12','#2d3a66'],['SYNC','Δ 12 ms','#2e7d5b'],['MAP TWIN','floor B2','#6d3fc4'],['EVIDENCE','clip #2214','#8a6232'],['API','/v1/events','#e9ebf3'],['CAPTURE','CAM 03 · 60fps','#2d3a66']];
  var termMats=TERMS.map(function(t){
    var light=t[2]==='#e9ebf3';
    var tex=canvasTex(256,112,function(x){x.globalAlpha=.9;x.fillStyle=t[2];x.fillRect(4,4,248,104);x.globalAlpha=1;
      x.strokeStyle=light?'#1a1d26':'rgba(255,255,255,.6)';x.lineWidth=3;x.strokeRect(4,4,248,104);
      x.fillStyle=light?'#11131a':'#fff';x.font='600 30px '+MONO;x.fillText(t[0],18,44);
      x.globalAlpha=.8;x.font='21px '+MONO;x.fillText(t[1],18,76);x.globalAlpha=.55;
      for(var i=0;i<5;i++)x.fillRect(18+i*46,90,12+((i*37+t[0].length*7)%30),5);});
    return reg(new THREE.SpriteMaterial({map:tex,clippingPlanes:[clip]}),.95);});
  var termR=rngf(404);
  function terminal(p,scale){var s=new THREE.Sprite(termMats[Math.floor(termR()*termMats.length)]);s.position.copy(p);s.center.set(-.08,-.3);s.scale.set(scale*3.4,scale*1.48,1);macro.add(s);}

  // ---------- 立体タイル ----------
  (function(){
    var r=rngf(5),fp=[],fc=[],ep=[];
    var FC=[col('#121a30'),col('#18233f'),col('#203056')];
    function boxm(x0,y0,z0,x1,y1,z1){
      var c=FC[r()<.5?0:r()<.8?1:2],v=[[x0,y0,z0],[x1,y0,z0],[x1,y1,z0],[x0,y1,z0],[x0,y0,z1],[x1,y0,z1],[x1,y1,z1],[x0,y1,z1]];
      [[0,1,2,3],[4,5,6,7],[0,1,5,4],[3,2,6,7],[0,3,7,4],[1,2,6,5]].forEach(function(f){[0,1,2,0,2,3].forEach(function(k){var p=v[f[k]];fp.push(p[0],p[1],p[2]);fc.push(c.r,c.g,c.b);});});
      [[0,1],[1,2],[2,3],[3,0],[4,5],[5,6],[6,7],[7,4],[0,4],[1,5],[2,6],[3,7]].forEach(function(e){var a=v[e[0]],b=v[e[1]];ep.push(a[0],a[1],a[2],b[0],b[1],b[2]);});
    }
    function hgt(){var k=r();return k<.55?.08:k<.85?.4+r()*1.2:k<.97?1.5+r()*2.5:4+r()*4;}
    var a,b,h,g=.12;
    for(a=-60;a<70;a+=2)for(b=-50;b<14;b+=2)if(r()<.4){h=hgt();boxm(a+g,-8,b+g,a+2-g,-8+h,b+2-g);}
    for(a=-60;a<70;a+=2)for(b=-8;b<20;b+=2)if(r()<.42){h=hgt()*.6;boxm(a+g,b+g,-12,a+2-g,b+2-g,-12+h);}
    for(a=-8;a<8;a+=2)for(b=-8;b<8;b+=2)if(r()<.55){h=hgt()*.4;boxm(-14.5,a+g,b+g,-14.5+h,a+2-g,b+2-g);}
    macro.add(new THREE.Mesh(geo(fp,fc),reg(new THREE.MeshBasicMaterial({vertexColors:true,side:THREE.DoubleSide}),.45)));
    macro.add(new THREE.LineSegments(geo(ep),reg(new THREE.LineBasicMaterial({color:col('#253661')}),.55)));
    var gp=[],gx=GATE,rg=rngf(9);for(var i=0;i<9;i++){var s=4.6;gp.push(gx,-s,-s,gx,s,-s, gx,s,-s,gx,s,s, gx,s,s,gx,-s,s, gx,-s,s,gx,-s,-s);gx+=.07+rg()*.16;}
    macro.add(new THREE.LineSegments(geo(gp),reg(new THREE.LineBasicMaterial({color:col('#4a6aa8'),clippingPlanes:[clip]}),.6)));
  })();

  // ---------- ニューロンの網（遠くまで続く） ----------
  var NN=1900,nx=new Float32Array(NN*3),deg=new Uint16Array(NN),hubs=[],nearIdx=[];
  (function(){
    var rn=rngf(77),i,j,centers=[];
    for(i=0;i<80;i++){var cx=5+Math.pow(rn(),.75)*125;centers.push([cx,(rn()-.5)*(22+cx*.6),(rn()-.5)*(34+cx*.8)-6,2+rn()*3+cx*.04]);}
    for(i=0;i<NN;i++){var x,y,z;
      if(rn()<.72){var c=centers[Math.floor(rn()*centers.length)],sp=c[3];x=c[0]+gs(rn)*sp*2.4;y=c[1]+gs(rn)*sp*2;z=c[2]+gs(rn)*sp*2.4;}
      else{x=6+Math.pow(rn(),.8)*120;y=(rn()-.5)*(26+x*.7);z=(rn()-.5)*(40+x*.9)-6;}
      nx[i*3]=Math.max(4,x);nx[i*3+1]=y;nx[i*3+2]=z;if(x<48)nearIdx.push(i);}
    var P=[],Cl=[],BD=[],TP2=[],TC2=[],A=new V3(),B=new V3();
    for(i=0;i<NN;i++){var b1=-1,b2=-1,d1=1e9,d2=1e9;
      for(j=0;j<NN;j++){if(j===i)continue;var dx=nx[i*3]-nx[j*3],dy=nx[i*3+1]-nx[j*3+1],dz=nx[i*3+2]-nx[j*3+2],d=dx*dx+dy*dy+dz*dz;
        if(d<d1){d2=d1;b2=b1;d1=d;b1=j;}else if(d<d2){d2=d;b2=j;}}
      var tg=[b1,b2];if(rn()<.14)tg.push(Math.floor(rn()*NN));
      for(var q=0;q<tg.length;q++){var t=tg[q];if(t<0)continue;A.set(nx[i*3],nx[i*3+1],nx[i*3+2]);B.set(nx[t*3],nx[t*3+1],nx[t*3+2]);
        if(q===2&&A.distanceTo(B)>34)continue;deg[i]++;deg[t]++;
        var k=rn(),c0=k<.45?C.deep:k<.75?C.blue:k<.92?C.violet:C.cyan;
        var ctl=bendCtrl(A,B,rn,q===2?.3:.22);curve(P,Cl,A,B,ctl,q===2?6:3,c0,k<.5?C.blue:C.violet,q===2?.22:.42,q===2?.22:.42);
        if(rn()<.45){var bt=.2+rn()*.6,bu=1-bt;BD.push(bu*bu*A.x+2*bu*bt*ctl.x+bt*bt*B.x,bu*bu*A.y+2*bu*bt*ctl.y+bt*bt*B.y,bu*bu*A.z+2*bu*bt*ctl.z+bt*bt*B.z);}}
    }
    for(i=0;i<NN;i++){if(rn()<.45){var tsc=1+nx[i*3]*.015,tm=3+Math.floor(rn()*3);A.set(nx[i*3],nx[i*3+1],nx[i*3+2]);
      for(var t2=0;t2<tm;t2++){B.copy(A).add(unit(rn).multiplyScalar((.5+rn())*tsc));curve(TP2,TC2,A,B,bendCtrl(A,B,rn,.3),2,C.cyan,C.deep,.5,.08);}}}
    addLines(P,Cl,.75);nmove(addLines(TP2,TC2,.75));
    var bdp=nmove(pts(BD,null,.26,glowTex,1));bdp.material.color=col('#bfe3ff');
    var sp=[],sc=[],gp=[],big=[];
    var order=[];for(i=0;i<NN;i++)order.push(i);order.sort(function(a,b){return deg[b]-deg[a];});hubs=order.slice(0,34);
    var isHub={};hubs.forEach(function(h){isHub[h]=1;});
    for(i=0;i<NN;i++){var k2=rn();

    sts.forEach(function(o){o.setAttribute('aria-pressed',o===b?'true':'false');});});});
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(function(){redraws.forEach(function(d){d();});});

  build();resize();
  if(window.ResizeObserver)new ResizeObserver(resize).observe(box);else window.addEventListener('resize',resize);
  requestAnimationFrame(draw);
})();
</script>
